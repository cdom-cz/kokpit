[program:horizon]
process_name=%(program_name)s
command=php artisan horizon
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=zerops
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
; Must exceed the longest Horizon supervisor timeout (300 s, config/horizon.php)
; so a graceful stop lets a running job finish before supervisord kills it.
stopwaitsecs=360
startsecs=3
startretries=3
priority=999
