name: kokpit
type: laravel
docroot: public
php_version: "8.5"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: postgres
    version: "18"
use_dns_when_possible: true
composer_version: "2"
web_environment: []
corepack_enable: false

# Create the dedicated test database once; the DDEV db role is a superuser with CREATEDB.
# tests/TestCase.php refuses to run against any database whose name does not end in _test.
hooks:
  post-start:
    - exec: "PGPASSWORD=db psql -h db -U db -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='kokpit_test'\" | grep -q 1 || PGPASSWORD=db createdb -h db -U db kokpit_test"
