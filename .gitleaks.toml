title = "Kokpit gitleaks config"

# Extends the upstream default ruleset (Stripe sk_/rk_ tokens, GitHub PATs, generic API keys, ...) and adds the
# Kokpit-specific shapes it lacks (D-10, HYG-05). Pass this file explicitly with --config everywhere
# (hook, CI, tests); never rely on auto-discovery.
#
# Exemptions live only here or in a reviewed .gitleaksignore. The hook and CI run with
# --ignore-gitleaks-allow, so an inline "gitleaks:allow" comment can never hide a finding.

[extend]
useDefault = true

[[rules]]
id = "kokpit-stripe-publishable-or-webhook"
description = "Stripe publishable live key or webhook signing secret"
regex = '''\b(?:pk_live_|whsec_)[A-Za-z0-9]{16,}'''
keywords = ["pk_live_", "whsec_"]

[[rules]]
id = "kokpit-stripe-object-id"
description = "Stripe account id or Payment Link id"
regex = '''\b(?:acct|plink)_[A-Za-z0-9]{12,}'''
keywords = ["acct_", "plink_"]

# Parity with the home-path rule of scripts/lib/scan.awk: the name segment may end the token (bare after an
# assignment, quoted, at the end of a line, before "&&" or ":"), and a /home/ or /Users/ segment that follows a
# letter, digit, dot, underscore, tilde or hyphen (a URL path, a relative path) is not a home directory.
# RE2 has no lookbehind, so the left boundary is a consumed character. It excludes CR and LF and the pattern is
# multi-line, so a path at the start of a line matches on its own line and not from the previous line's newline.
# The secret is the name segment only (secretGroup = 1). The default ruleset's global allowlist drops any
# finding whose secret is a path starting with /home/ or /Users/<a>/<b>, which used to hide every /home/ path;
# a bare name is not path-shaped, so it survives. The allowlist below therefore tests the captured name.
[[rules]]
id = "kokpit-home-path"
description = "Personal absolute home directory path"
regex = '''(?m)(?:^|[^A-Za-z0-9._~\r\n-])/(?:Users|home)/([A-Za-z0-9._-]+)'''
secretGroup = 1
keywords = ["/users/", "/home/"]
[[rules.allowlists]]
# Placeholder and system names that are documentation, CI-runner or OS conventions, not a person. Kept in step
# with the home-path rule of scripts/lib/scan.awk (which also allows ddev and the macOS Shared folder). Whole
# name segments only.
regexes = ['''^(?:example|user|username|name|you|runner|vagrant|ubuntu|www-data|ddev|Shared)$''']
[[rules.allowlists]]
# A Windows system folder written with forward slashes ("C:/Users/Public") also matches this rule, because the
# colon is a legal left boundary (a PATH list entry). scripts/lib/scan.awk hands every drive-letter path to the
# Windows rule; here only the four names the Windows rule never reports are exempt, tested on the whole match.
regexTarget = "match"
regexes = ['''(?i)^:/Users/(?:public|default|all|runneradmin)$''']

# Drive letter, colon, then Users and the name segment, with backslashes, doubled backslashes (JSON or string
# escaping) or forward slashes in any letter case. Parity with the Windows branch of the home-path rule in
# scripts/lib/scan.awk. In a TOML literal string the backslashes are literal, so RE2 sees a class of backslash
# and slash. The left boundary is a consumed character that excludes CR and LF (see kokpit-home-path), so a
# drive letter that ends a word ("file:///users/x") is not a drive. The secret is the name segment only.
[[rules]]
id = "kokpit-windows-home-path"
description = "Personal Windows home directory path"
regex = '''(?im)(?:^|[^0-9a-z\r\n])[a-z]:[\\/]+users[\\/]+([a-z0-9._-]+)'''
secretGroup = 1
keywords = ["users"]
[[rules.allowlists]]
# System folders and placeholder names, whole name segments only; the same list as the scanner's Windows branch.
regexes = ['''(?i)^(?:example|user|username|name|you|public|default|all|runneradmin)$''']

# RE2's \b is ASCII-only, so the old trailing word boundary made the "ič" alternative dead ("č" is not a word
# character, so no boundary exists before ":"). The keyword is followed directly by the optional quote and the
# separator, which is boundary enough; the left boundary is a consumed character, as in kokpit-home-path.
# "ic" is the common transliteration of "ič".
[[rules]]
id = "kokpit-ico-like"
description = "Company-ID-like 8-digit number next to an ID keyword"
regex = '''(?im)(?:^|[^0-9a-z\r\n])(?:ičo|ico|ič|ic|company[_ -]?id)["']?\s*[:=]\s*["']?(\d{8})\b'''
secretGroup = 1
keywords = ["ic", "ič", "company"]
[[rules.allowlists]]
# The placeholder company ids the repository documents (CLAUDE.md, CONTRIBUTING.md).
stopwords = ["12345678", "00000000"]

[[rules]]
id = "kokpit-hosting-endpoint"
description = "Hosting or S3-compatible object-storage endpoint hostname"
regex = '''(?i)\b(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:zerops\.app|amazonaws\.com|r2\.cloudflarestorage\.com|backblazeb2\.com|wasabisys\.com|digitaloceanspaces\.com|linodeobjects\.com)\b'''
keywords = ["zerops.app", "amazonaws.com", "r2.cloudflarestorage.com", "backblazeb2.com", "wasabisys.com", "digitaloceanspaces.com", "linodeobjects.com"]

[[rules]]
id = "kokpit-zerops-token"
description = "Zerops access token assigned to a ZEROPS_TOKEN-style variable"
# [ASSUMED] (research A2): Zerops documents no stable token prefix, so this is anchored on the variable name
# next to a 16+ character token instead of on a token format. Generic high-entropy values are additionally
# covered by the default generic-api-key rule.
regex = '''(?i)\bzerops[_-]?(?:api[_-]?)?(?:token|key)\b["']?\s*[:=]\s*["']?([A-Za-z0-9_\-]{16,})'''
secretGroup = 1
keywords = ["zerops"]
