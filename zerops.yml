zerops:
  - setup: kokpit
    build:
      base:
        - alpine/php@8.5
      os: alpine
      buildCommands:
        - composer install --optimize-autoloader --no-dev --no-scripts --ignore-platform-reqs
      deployFiles: ./
      cache:
        - vendor
        - composer.lock
    run:
      base: alpine/php-nginx@8.5
      os: alpine
      siteConfigPath: site.conf.tmpl
      prepareCommands:
        - sudo apk update
        - sudo apk add --no-cache supervisor php85-pcntl php85-posix icu-data-full
        - sudo rc-update add supervisord default
        - sudo mkdir -p /etc/supervisor.d
        - sudo mkdir -p /var/log/supervisor
        - sudo rc-service supervisord start
        - sudo rc-service supervisord status
        - sudo supervisorctl status
      initCommands:
        # The build runs composer with --no-scripts: the post-autoload-dump scripts boot the
        # application, and the build has no service-level environment, so ProductionConfigGuard
        # would refuse. They run here instead, with the real environment (and the guard).
        - php artisan package:discover --ansi
        - php artisan filament:upgrade
        - php artisan optimize:clear
        - php artisan optimize
        - php artisan icons:cache
        - sudo -E -u zerops -- zsc execOnce ${appVersionId} -- php artisan migrate --force
        # Zerops stops the deploy at the first failing initCommand, so a failed migration
        # (execOnce) or a failed verify (pending migration, unreachable database or Redis)
        # ends the deploy before traffic is switched. The verify runs on every container,
        # deliberately without execOnce.
        - php artisan kokpit:deploy:verify
        - php artisan filament:optimize
        - sudo cp supervisor-horizon.ini /etc/supervisor.d/
        # Clean up the pre-Horizon worker program if the container is reused.
        - sudo rm -f /etc/supervisor.d/supervisor-laravel.ini
        - sudo supervisorctl reread
        - sudo supervisorctl update
        - sudo supervisorctl start horizon
        # API documentation (D-17, owner-approved): generated on every container from its own code, with
        # its own APP_URL as the documented base URL, and last so a failure cannot hide an earlier step.
        # Deliberately no execOnce: the output is container-local and never committed. A failing generation
        # fails the deploy after the migration ran and Horizon started, so migrations must stay backward
        # compatible; the previous version keeps serving. Open item (A10), to confirm in the first rehearsal
        # together with the sudo -u zerops question: the init user can write the Scribe output directories.
        - php artisan scribe:generate --no-interaction

      crontab:
        - command: "php artisan schedule:run"
          timing: "* * * * *"
          workingDir: /var/www
          allContainers: true
